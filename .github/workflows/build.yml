name: Build & Validate Blocklists

on:
  push:
    branches: [ main ]
    paths:
      - 'config/**'
      - 'src/**'
      - 'pyproject.toml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Build Blocklists
        run: |
          python src/build.py

      - name: Commit & Push changes (if on main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ blocklist.txt
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nas listas compiladas."
          else
            git commit -m "chore(auto): compilação automática das listas [skip ci]"
            git push
          fi
